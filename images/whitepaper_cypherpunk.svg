<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">

  <!-- ── BACKGROUND ─────────────────────────────────────── -->
  <rect width="400" height="600" fill="#030b03"/>

  <!-- Matrix rain columns (very subtle) -->
  <g font-family="monospace" font-size="10" fill="#0a2a0a" opacity="1">
    <text x="12"  y="40">0</text><text x="12"  y="55">1</text><text x="12"  y="70">1</text><text x="12"  y="85">0</text><text x="12"  y="100">1</text><text x="12"  y="115">0</text><text x="12"  y="130">0</text><text x="12"  y="145">1</text><text x="12"  y="160">1</text>
    <text x="28"  y="55">1</text><text x="28"  y="70">0</text><text x="28"  y="85">1</text><text x="28"  y="100">1</text><text x="28"  y="115">0</text><text x="28"  y="130">1</text>
    <text x="356" y="40">1</text><text x="356" y="55">0</text><text x="356" y="70">0</text><text x="356" y="85">1</text><text x="356" y="100">1</text><text x="356" y="115">0</text><text x="356" y="130">1</text><text x="356" y="145">0</text>
    <text x="372" y="55">0</text><text x="372" y="70">1</text><text x="372" y="85">0</text><text x="372" y="100">1</text><text x="372" y="115">1</text>
    <text x="12"  y="430">1</text><text x="12"  y="445">0</text><text x="12"  y="460">1</text><text x="12"  y="475">0</text><text x="12"  y="490">1</text>
    <text x="356" y="430">0</text><text x="356" y="445">1</text><text x="356" y="460">0</text><text x="356" y="475">1</text>
  </g>

  <!-- ── TOP STRIP ─────────────────────────────────────── -->
  <rect x="0" y="0" width="400" height="38" fill="#0d2a0d"/>
  <text x="200" y="25" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="bold" fill="#44cc44" letter-spacing="6">CYPHERPUNKS</text>

  <!-- ══════════════════════════════════════════════════════
       THREE MASKED FIGURES  (left · center · right)
       Inspired by the iconic Wired May/June 1993 cover
       (Tim May · Eric Hughes · John Gilmore, masked)
       ══════════════════════════════════════════════════════ -->

  <!-- ── LEFT FIGURE ──────────────────────────────────── -->
  <g>
    <!-- jacket/body -->
    <rect x="54" y="265" width="94" height="210" rx="4" fill="#0a1f0a"/>
    <!-- collar left -->
    <polygon points="88,265 101,295 101,265" fill="#153015"/>
    <!-- collar right -->
    <polygon points="114,265 101,295 114,265" fill="#0f250f"/>
    <!-- neck -->
    <rect x="91" y="245" width="20" height="24" fill="#1a4a1a"/>
    <!-- hair/head-shadow -->
    <ellipse cx="101" cy="215" rx="42" ry="48" fill="#0d220d"/>
    <!-- face -->
    <ellipse cx="101" cy="220" rx="36" ry="42" fill="#1a4a1a"/>
    <!-- mask (oval, golden-green reflective) -->
    <ellipse cx="101" cy="228" rx="30" ry="20" fill="#4a7a3a"/>
    <!-- mask upper sheen -->
    <ellipse cx="101" cy="220" rx="22" ry="9" fill="#6aaa4a" opacity="0.55"/>
    <!-- mask lower edge shadow -->
    <ellipse cx="101" cy="237" rx="24" ry="7" fill="#2a4a1a" opacity="0.5"/>
    <!-- eye slits -->
    <ellipse cx="93"  cy="227" rx="7" ry="3.5" fill="#0d1a0d" opacity="0.8"/>
    <ellipse cx="109" cy="227" rx="7" ry="3.5" fill="#0d1a0d" opacity="0.8"/>
    <!-- slit gleam -->
    <ellipse cx="91"  cy="226" rx="2.5" ry="1.2" fill="#55dd44" opacity="0.3"/>
    <ellipse cx="107" cy="226" rx="2.5" ry="1.2" fill="#55dd44" opacity="0.3"/>
  </g>

  <!-- ── RIGHT FIGURE ──────────────────────────────────── -->
  <g>
    <!-- jacket/body -->
    <rect x="252" y="265" width="94" height="210" rx="4" fill="#0a1f0a"/>
    <!-- collar -->
    <polygon points="286,265 299,295 299,265" fill="#153015"/>
    <polygon points="312,265 299,295 312,265" fill="#0f250f"/>
    <!-- neck -->
    <rect x="289" y="245" width="20" height="24" fill="#1a4a1a"/>
    <!-- hair/head-shadow -->
    <ellipse cx="299" cy="215" rx="42" ry="48" fill="#0d220d"/>
    <!-- face -->
    <ellipse cx="299" cy="220" rx="36" ry="42" fill="#1a4a1a"/>
    <!-- mask -->
    <ellipse cx="299" cy="228" rx="30" ry="20" fill="#4a7a3a"/>
    <ellipse cx="299" cy="220" rx="22" ry="9" fill="#6aaa4a" opacity="0.55"/>
    <ellipse cx="299" cy="237" rx="24" ry="7" fill="#2a4a1a" opacity="0.5"/>
    <ellipse cx="291" cy="227" rx="7" ry="3.5" fill="#0d1a0d" opacity="0.8"/>
    <ellipse cx="307" cy="227" rx="7" ry="3.5" fill="#0d1a0d" opacity="0.8"/>
    <ellipse cx="289" cy="226" rx="2.5" ry="1.2" fill="#55dd44" opacity="0.3"/>
    <ellipse cx="305" cy="226" rx="2.5" ry="1.2" fill="#55dd44" opacity="0.3"/>
  </g>

  <!-- ── CENTER FIGURE (Eric Hughes — most prominent) ────── -->
  <g>
    <!-- jacket/body -->
    <rect x="158" y="255" width="84" height="220" rx="4" fill="#122a12"/>
    <!-- lapels -->
    <polygon points="188,255 200,290 200,255" fill="#1a401a"/>
    <polygon points="212,255 200,290 212,255" fill="#152e15"/>
    <!-- tie (bright accent) -->
    <polygon points="197,258 200,265 203,258 201,310 199,310" fill="#22aa22"/>
    <!-- neck -->
    <rect x="190" y="232" width="20" height="27" fill="#265a26"/>
    <!-- hair/head-shadow (slightly taller = more prominent) -->
    <ellipse cx="200" cy="192" rx="48" ry="56" fill="#0f260f"/>
    <!-- face highlight -->
    <ellipse cx="200" cy="200" rx="42" ry="50" fill="#246624"/>
    <!-- mask (central figure — slightly brighter gold-green) -->
    <ellipse cx="200" cy="210" rx="34" ry="22" fill="#5a9044"/>
    <!-- mask upper sheen -->
    <ellipse cx="200" cy="201" rx="26" ry="10" fill="#7ac05a" opacity="0.6"/>
    <!-- mask lower shadow -->
    <ellipse cx="200" cy="221" rx="28" ry="8" fill="#2a4a2a" opacity="0.5"/>
    <!-- eye slits -->
    <ellipse cx="190" cy="209" rx="8" ry="4" fill="#0d1a0d" opacity="0.9"/>
    <ellipse cx="210" cy="209" rx="8" ry="4" fill="#0d1a0d" opacity="0.9"/>
    <!-- gleam on eye slits -->
    <ellipse cx="188" cy="208" rx="3" ry="1.5" fill="#77ee44" opacity="0.4"/>
    <ellipse cx="208" cy="208" rx="3" ry="1.5" fill="#77ee44" opacity="0.4"/>
    <!-- nose shadow -->
    <ellipse cx="200" cy="215" rx="4" ry="3" fill="#2a4a2a" opacity="0.4"/>
  </g>

  <!-- ── SHADOW / FLOOR gradient suggestion ─────────────── -->
  <rect x="0" y="455" width="400" height="20" fill="#030b03" opacity="0.6"/>

  <!-- ── DIVIDER ───────────────────────────────────────── -->
  <rect x="40" y="462" width="320" height="1.5" fill="#33aa33" opacity="0.7"/>

  <!-- ── TITLE BLOCK ──────────────────────────────────── -->
  <text x="200" y="492" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#335533" letter-spacing="3">A</text>
  <text x="200" y="512" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#44cc44" letter-spacing="1">CYPHERPUNK'S</text>
  <text x="200" y="538" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#44cc44" letter-spacing="1">MANIFESTO</text>

  <rect x="120" y="546" width="160" height="1" fill="#33aa33" opacity="0.4"/>

  <text x="200" y="563" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#336633">Eric Hughes · 9 mars 1993</text>

  <!-- ── BOTTOM STRIP ──────────────────────────────────── -->
  <rect x="0" y="580" width="400" height="20" fill="#0d2a0d"/>
  <text x="200" y="594" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#336633" letter-spacing="4">CYPHERPUNKS WRITE CODE</text>

</svg>
